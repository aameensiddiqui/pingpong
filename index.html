<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pinging-and-ponging</title>
    <script src="index.js" defer></script>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="game">
        <div class="controls">
            <button id="decreaseBall">−−Ball</button>
            <button id="increaseBall">++Ball</button>
            <button id="decreaseSpeed">−−Speed</button>
            <button id="increaseSpeed">++Speed</button>
        </div>
        <div id="gameOver" class="game-over hidden">
            <h2 id="winnerText"></h2>
            <button id="restartBtn">Play Again</button>
        </div>
        <canvas id="canvas"></canvas>
        <div id="score" class="score-card">
            <h1>Player 1 : <span id="player1">0</span></h1>
            <h1>Player 2 : <span id="player2">0</span></h1>
        </div>
        <audio src="/audio/mahesh.mp3"></audio>
        <audio src="/audio/insulted_me.mp3"></audio>
    </div>
</body>
</html>
